<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>FIT</title><style>*{box-sizing:border-box}:root{--y:#ffd400;--bg:#050505;--p:#101010;--line:#292929;--muted:#888}html,body{margin:0;background:#020202;color:#fff;font-family:Tahoma,Arial,sans-serif;direction:rtl}.app{width:min(100%,500px);min-height:100vh;margin:auto;background:linear-gradient(#060606,#090909);padding-bottom:88px}.top{padding:18px;display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:1000}.logo i{color:var(--y);font-style:normal}.tagline{font-size:9px;color:#777}.avatar{width:42px;height:42px;border-radius:14px;border:1px solid var(--line);display:grid;place-items:center;color:var(--y)}.content{padding:0 17px}.hero{min-height:190px;border:1px solid var(--line);border-radius:24px;padding:20px;background:radial-gradient(circle at 80%,#4b4100,#0b0b0b 60%);display:flex;align-items:center;justify-content:space-between}.hero h1{font-size:30px;line-height:1.35}.hero-art{font-size:75px}.y{color:var(--y)}.muted{color:var(--muted);font-size:11px;line-height:1.8}.title{font-size:27px;font-weight:1000;margin:5px 0}.section{font-size:18px;font-weight:900;margin:22px 0 10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{border:1px solid var(--line);border-radius:19px;background:#101010;padding:16px;min-height:130px;position:relative}.tile .ico{font-size:30px}.tile h3{font-size:15px}.tile .go{position:absolute;left:13px;bottom:10px;color:var(--y)}.week{display:flex;gap:7px;overflow:auto}.day{min-width:55px;text-align:center;border:1px solid var(--line);border-radius:13px;padding:8px 4px;color:#999;font-size:10px}.day b{display:block;color:var(--y);font-size:16px;margin-top:4px}.card,.exercise,.meal,.supp,.alarm{border:1px solid var(--line);background:#101010;border-radius:17px;padding:13px;margin-top:9px}.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.pill,.reps{background:#1b1906;border:1px solid #403800;color:var(--y);border-radius:9px;padding:6px 8px;font-size:10px;white-space:nowrap}.progress{display:flex;justify-content:space-between;align-items:center;margin-top:10px;padding:14px;border:1px solid var(--line);border-radius:17px}.progress strong{font-size:28px;color:var(--y)}.exercise{display:flex;align-items:center;gap:9px}.num{width:35px;height:35px;border-radius:11px;border:1px solid #444;background:#171717;color:#777;font-weight:900}.num.done{background:var(--y);color:#050505}.ex{flex:1}.exname{font-size:12px;font-weight:900}.exname.done{text-decoration:line-through;color:#666}.muscle{font-size:9px;color:#777;margin-top:3px}.primary,.outline{display:block;width:100%;padding:14px;border-radius:15px;text-align:center;font-weight:900;margin-top:12px}.primary{background:var(--y);color:#050505}.outline{border:1px solid var(--y);color:var(--y);background:#111}.search{width:100%;margin-top:10px;padding:13px;border-radius:14px;border:1px solid var(--line);background:#101010;color:#fff}.detail{overflow:hidden;border:1px solid var(--line);border-radius:20px;background:#101010}.video{height:220px;display:grid;place-items:center;background:radial-gradient(circle,#292929,#090909 70%)}.play{font-size:64px}.tags{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.tag{padding:7px 9px;border-radius:10px;background:#1a1805;border:1px solid #403800;color:var(--y);font-size:10px}.runbox{text-align:center;padding:25px;border:1px solid var(--line);border-radius:22px;background:radial-gradient(circle,#292300,#0b0b0b 65%)}.runicon{font-size:70px}.bigtime{font-size:38px;font-weight:1000;color:var(--y)}.alarm{display:flex;align-items:center;gap:12px}.alarmmain{flex:1}.alarmtime{font-size:25px;font-weight:1000}.switch{appearance:none;width:48px;height:27px;border-radius:20px;background:#333;position:relative}.switch:before{content:'';position:absolute;right:3px;top:3px;width:21px;height:21px;border-radius:50%;background:#aaa}.switch:checked{background:var(--y)}.switch:checked:before{right:24px;background:#050505}.event{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid #202020}.eventtime{width:55px;color:var(--y);font-weight:900;font-size:10px}.meal,.supp{display:flex;gap:12px}.sticker{width:58px;height:58px;flex:none;border-radius:17px;background:#191919;display:grid;place-items:center;font-size:30px}.mealm,.suppm{flex:1}.list{list-style:none;padding:0;font-size:11px;color:#ccc;line-height:2}.note{margin-top:12px;padding:13px;border-radius:14px;background:#171405;border:1px solid #393000;color:#aaa;font-size:10px;line-height:1.9}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,500px);height:76px;background:#080808;border-top:1px solid #222;display:flex;z-index:10}.nav{flex:1;text-align:center;color:#666;font-size:9px;padding-top:9px}.nav span{display:block;font-size:21px;margin-bottom:4px}.nav.active{color:var(--y)}.back{display:inline-block;color:var(--y);font-size:12px;margin:8px 0}a{text-decoration:none;color:inherit}@media(min-width:700px){.app{margin:25px auto;border:1px solid #181818;border-radius:28px;overflow:hidden}.bottom{bottom:25px;border-radius:0 0 28px 28px}}.done-btn{border:1px solid #403800;background:#1b1906;color:var(--y);border-radius:9px;padding:7px 8px;font-size:9px;font-family:inherit;white-space:nowrap}.done-btn.done{background:var(--y);color:#050505;border-color:var(--y)}.measure-form{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.measure-form label{font-size:10px;color:#aaa}.measure-form input{width:100%;margin-top:5px;padding:12px;border-radius:12px;border:1px solid var(--line);background:#101010;color:#fff;font-family:inherit}.measure-form .full{grid-column:1/-1}.measure-form button{grid-column:1/-1}.credit{text-align:center;color:#666;font-size:9px;padding:18px 0 4px}.checkrow{display:flex;align-items:center;justify-content:space-between;gap:10 </style></head><body><main class="app"><div id="view"></div></main><nav class="bottom"><a class="nav" data-page="home" href="#home"><span>⌂</span>خانه</a><a class="nav" data-page="workout" href="#workout?day=A"><span>🏋️</span>تمرین</a><a class="nav" data-page="running" href="#running"><span>🏃</span>دویدن</a><a class="nav" data-page="nutrition" href="#nutrition"><span>🍽️</span>تغذیه</a><a class="nav" data-page="supplements" href="#supplements"><span>💊</span>مکمل</a></nav><script>
const K='FIT_DONE', MK='FIT_MEALS', SK='FIT_SUPPS', PK='FIT_MEASURE';
function faNum(v){return String(v).replace(/\d/g,d=>'۰۱۲۳۴۵۶۷۸۹'[d])}
function read(k){try{return JSON.parse(localStorage.getItem(k)||'{}')}catch(e){return{}}}
function write(k,v){localStorage.setItem(k,JSON.stringify(v))}
function dm(){return read(K)}
function toggle(k,b){let d=dm();d[k]=!d[k];write(K,d);let row=b.closest('.exercise');let num=row?row.querySelector('.num'):b;if(num)num.classList.toggle('done',d[k]);let n=document.querySelector('[data-name="'+k+'"]');if(n)n.classList.toggle('done',d[k]);let s=document.querySelector('[data-status="'+k+'"]');if(s){s.textContent=d[k]?'✓ انجام شد':'انجام شد';s.classList.toggle('done',d[k])}update()}
function restore(){let d=dm();document.querySelectorAll('[data-key]').forEach(x=>{let done=!!d[x.dataset.key];let n=x.querySelector('.num');if(n)n.classList.toggle('done',done);let name=x.querySelector('.exname');if(name)name.classList.toggle('done',done);let s=x.querySelector('[data-status]');if(s)s.textContent=done?'انجام شد':'انجام نشده';let btn=x.querySelector('.done-btn');if(btn){btn.classList.toggle('done',done);btn.textContent=done?'✓ انجام شد':'انجام شد'}});update();restoreChecks(MK,'meal');restoreChecks(SK,'supp')}
function update(){let a=[...document.querySelectorAll('[data-key]')],n=a.filter(x=>{let b=x.querySelector('.num');return b&&b.classList.contains('done')}).length,p=document.getElementById('progress');if(p)p.textContent=faNum(n)+' از '+faNum(a.length);let c=document.getElementById('countDone');if(c)c.textContent=n;let t=document.getElementById('countTotal');if(t)t.textContent=a.length}
function toggleCheck(store,key,el){let d=read(store);d[key]=!d[key];write(store,d);applyCheck(el,d[key])}
function applyCheck(el,done){if(!el)return;el.classList.toggle('done',done);el.textContent=done?'✓ انجام دادم':'انجام دادم';el.setAttribute('aria-pressed',done?'true':'false')}
function restoreChecks(store,kind){let d=read(store);document.querySelectorAll('[data-'+kind+']').forEach(el=>applyCheck(el,!!d[el.dataset[kind]]))}
function notify(){if(!('Notification'in window)){alert('مرورگر اعلان را پشتیبانی نمی‌کند');return}Notification.requestPermission().then(p=>alert(p==='granted'?'اعلان فعال شد.':'اجازه اعلان داده نشد.'))}
function alarms(){document.querySelectorAll('[data-alarm]').forEach(x=>{let k=x.dataset.alarm,v=localStorage.getItem('a'+k);x.checked=v===null?true:v==='1';x.onchange=()=>localStorage.setItem('a'+k,x.checked?'1':'0')})}
function saveMeasure(){let f=document.getElementById('measureForm');if(!f)return;let d=read(PK);let now=new Date(),date=f.date.value||now.toLocaleDateString('fa-IR');let item={date,weight:f.weight.value,height:f.height.value,waist:f.waist.value,shoulder:f.shoulder.value,wrist:f.wrist.value};if(!item.weight&&!item.height&&!item.waist&&!item.shoulder&&!item.wrist){alert('حداقل یک اندازه را وارد کن.');return}d[Date.now()]=item;write(PK,d);f.reset();f.date.value=date;renderMeasures()}
function renderMeasures(){let box=document.getElementById('measureHistory');if(!box)return;let d=read(PK),items=Object.values(d).sort((a,b)=>String(b.date).localeCompare(String(a.date))).slice(0,12);box.innerHTML=items.length?items.map(x=>'<div class="card"><div class="row"><b>'+x.date+'</b><span class="pill">ثبت اندازه</span></div><div class="tags">'+[['وزن',x.weight,'kg'],['قد',x.height,'cm'],['کمر',x.waist,'cm'],['سرشانه',x.shoulder,'cm'],['مچ',x.wrist,'cm']].filter(a=>a[1]).map(a=>'<span class="tag">'+a[0]+': '+a[1]+' '+a[2]+'</span>').join('')+'</div></div>').join(''):'<div class="muted">هنوز اندازه‌ای ثبت نشده است.</div>'}
const DATA={"A": ["شنبه", "سرشانه + پشت", [["شنا سوئدی گرم کردن ( پا بالا ترین نقطه )", "درحد توان × ۴", "سینه، سرشانه، پشت بازو"], ["سرشانه هالتر از پشت", "۱۲ × ۳", "سرشانه"], ["سرشانه دستگاه", "۱۲ × ۴", "سرشانه"], ["سرشانه دمبل", "۱۰ × ۴", "سرشانه"], ["سرشانه صلیب", "۱۲ × ۴", "سرشانه میانی"], ["سرشانه هالتر از جلو", "۱۲ × ۴", "سرشانه جلویی"], ["زیر بغل قایقی", "۱۲ × ۴", "پشت، زیربغل"], ["فلای بک از پشت", "۱۲ × ۴", "سرشانه خلفی، پشت"], ["نشر از جلو هالتر مچ برعکس", "۱۲ × ۴", "سرشانه جلویی"], ["نشر از جلو دنبل عمود", "۱۰ × ۳", "سرشانه"], ["کول هالتر یا با دستگاه", "۱۲ × ۴", "کول، ذوزنقه‌ای"]]], "B": ["یکشنبه", "سینه + پشت بازو", [["کراس اور", "۱۵ × ۴", "سینه"], ["پرس بالا سینه دستگاه", "۱۲ × ۴", "بالاسینه"], ["بالاسینه هالتر", "۱۲ × ۴", "بالاسینه"], ["بالا سینه دمبل", "۱۰-۱۲-۱۵", "بالاسینه"], ["پرس سینه دمبل", "۱۲ × ۴", "سینه"], ["شنا سوئدی", "۱۰-۱۰-۱۲", "سینه، پشت بازو"], ["پرس سینه هالتر", "۱۲ × ۴", "سینه"], ["پشت بازو سیم کش", "۱۰-۱۰-۱۲-۱۲", "پشت بازو"], ["پشت بازو هالتر خوابیده", "۱۰-۱۰-۱۲-۱۲", "پشت بازو"], ["پشت بازو دمبل", "۱۲ × ۳", "پشت بازو"], ["پشت بازو سیم کش طناب", "۱۲ × ۴", "پشت بازو"], ["پشت بازو دیپ آزاد", "در حد توان × ۴", "پشت بازو، سینه"]]], "C": ["دوشنبه", "پا", [["جلو ران دستگاه", "۱۲ × ۴", "چهارسر ران"], ["اسکات پا", "۸-۸-۱۰-۱۲", "چهارسر، سرینی"], ["هاگ پا دستگاه", "۱۰ × ۳", "چهارسر، سرینی"], ["پرس پا دستگاه", "۱۰ × ۴", "چهارسر، همسترینگ"], ["پشت ران هالتر", "۱۰ × ۴", "همسترینگ"], ["سی سی اسکات", "۱۰ × ۴", "چهارسر"], ["پشت ران دستگاه", "۱۲ × ۴", "همسترینگ"], ["کات باسن", "۱۰ × ۴", "سرینی"], ["ساق پا دستگاه", "۱۲ × ۵", "ساق"]]], "D": ["سه‌شنبه", "سینه", [["کراس اور نیم خیز", "۱۰ × ۳", "سینه"], ["پرس سینه هالتر", "۱۲ × ۴", "سینه"], ["پرس سینه دمبل دست جمع", "۱۲ × ۴", "سینه، پشت بازو"], ["پرس دستگاه", "۱۲ × ۴", "سینه"], ["کراس اور از پایین", "۱۲ × ۴", "سینه"], ["کراس اور از بالا", "۱۲ × ۴", "سینه"], ["شنا سوئدی روی زمین", "۱۲ × ۴", "سینه، پشت بازو"], ["پلاور دمبل", "۱۲ × ۴", "سینه، زیربغل"], ["بالا سینه دمبل", "۱۲ × ۴", "بالاسینه"], ["پارالل", "در حد توان × ۴", "سینه، پشت بازو"], ["فلای دستگاه دست بالا", "۱۵ × ۴", "سینه"], ["شنا سوئدی دستگاه دو مرتبه تکرار", "تا حد ناتوانی × ۴", "سینه، پشت بازو"]]], "E": ["چهارشنبه", "زیر بغل + جلو بازو", [["زیر بغل سیم کش از جلو", "۱۰-۱۰-۱۲-۱۵", "زیربغل"], ["زیر بغل اچ", "۱۲ × ۴", "زیربغل"], ["زیر بغل اره ای", "۱۲ × ۴", "زیربغل، پشت"], ["پلاور دستگاه", "۱۵ × ۳", "زیربغل"], ["زیر بغل سیم کش از پشت", "۱۲ × ۴", "زیربغل"], ["زیر بغل سیم کش کراس با تناب پلاور", "۱۲ × ۴", "زیربغل"], ["زیر بغل قایقی دست باز", "۱۰ × ۴", "زیربغل، پشت"], ["جلو بازو دمبل تک تک چکشی", "۱۰-۱۰-۱۲-۱۲", "جلو بازو"], ["جلو بازو لاری دستگاه", "۱۲ × ۴", "جلو بازو"], ["جلو بازو سیمکش", "۱۲ × ۴", "جلو بازو"], ["جلو بازو هالتر", "۱۲ × ۴", "جلو بازو"]]], "FG": ["پنجشنبه", "شکم + پهلو + فیله", [["شکم سیم کش یا دستگاه", "۲۰ × ۴", "شکم"], ["شکم سطح شیبدار", "۲۰ × ۳", "شکم"], ["زیر شکم خلبانی", "۲۰ × ۴", "زیر شکم"], ["زیر شکم خوابیده با یار کمکی قدرتی", "۲۰ × ۴", "زیر شکم"], ["پهلو سیم کش", "۲۰ × ۴", "پهلو"], ["پهلو مسگری", "۲۰ × ۴", "پهلو"], ["فیله کمر نیمکت", "۱۵ × ۳", "فیله کمر"], ["شکم با دستگاه کرانچ", "تا حد ناتوانی × ۳", "شکم"], ["شکم روی میز", "تا حد ناتوانی × ۴", "شکم"], ["شکم با سیمکش", "تا حد ناتوانی × ۴", "شکم"]]]};
let DAY='A';
function route(){let raw=location.hash.slice(1)||'home', [path,q]=raw.split('?'); let params=new URLSearchParams(q||''); if(path==='workout')DAY=params.get('day')||'A'; renderPage(path,params)}
function renderPage(path,params){
 const key=({home:'index.html',workout:'workout.html',exercise:'exercise.html',running:'running.html',nutrition:'nutrition.html',supplements:'supplements.html',measurements:'measurements.html'})[path]||'index.html';
 const html=TPL[key]; document.getElementById('view').innerHTML=html;
 document.title={home:'خانه | FIT',workout:'بدنسازی | FIT',exercise:'جزئیات حرکت | FIT',running:'دویدن روزانه | FIT',nutrition:'تغذیه | FIT',supplements:'مکمل و دارو | FIT',measurements:'اندازه‌گیری | FIT'}[path]||'FIT';
 setActive(path); initPage(path,params); window.scrollTo(0,0);
}
function setActive(path){document.querySelectorAll('.bottom .nav').forEach(x=>x.classList.remove('active'));let a=document.querySelector('.nav[data-page="'+path+'"]');if(a)a.classList.add('active')}
function initPage(path,params){
 if(path==='workout'){let W=DATA[DAY]||DATA.A;document.getElementById('wt').textContent='برنامه '+DAY;document.getElementById('ws').textContent=W[0]+' • '+W[1];window.render=function(){let s=(document.getElementById('search').value||'').toLowerCase(),h='';W[2].forEach((e,i)=>{if(s&&!e[0].toLowerCase().includes(s)&&!e[2].toLowerCase().includes(s))return;let k=DAY+'-'+(i+1);h+='<div class="exercise" data-key="'+k+'"><button class="num" onclick="toggle(\''+k+'\',this)">'+(i+1)+'</button><a class="ex" href="#exercise?day='+DAY+'&i='+i+'"><div class="exname" data-name="'+k+'">'+e[0]+'</div><div class="muscle">'+e[2]+'</div></a><span class="reps">'+e[1]+'</span><button class="done-btn" data-status="'+k+'" onclick="toggle(\''+k+'\',this)">انجام شد</button></div>'});document.getElementById('list').innerHTML=h;restore()};render()}
 if(path==='exercise'){let d=params.get('day')||'A',i=+(params.get('i')||0),w=DATA[d]||DATA.A,e=w[2][i]||w[2][0];document.getElementById('en').textContent=e[0];document.getElementById('es').textContent=w[0]+' • برنامه '+d;document.getElementById('er').textContent=e[1];document.getElementById('em').innerHTML=e[2].split('،').map(x=>'<span class="tag">'+x.trim()+'</span>').join('');document.getElementById('yt').href='https://www.youtube.com/results?search_query='+encodeURIComponent(e[0]+' آموزش بدنسازی')}
 if(path==='running'){alarms()}
 if(path==='nutrition'){restoreChecks(MK,'meal')}
 if(path==='supplements'){restoreChecks(SK,'supp')}
